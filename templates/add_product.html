<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>

<h1>Add Product</h1>

<form method="POST" action="/add_product" enctype="multipart/form-data">
    <label for="name">Product Name:</label>
    <input type="text" name="name" required>

    <label for="price">Price (₦):</label>
    <input type="text" name="price" required>

    <label for="image_file">Upload Product Photo from Device:</label>
    <input type="file" name="image_file" accept="image/*">

    <p style="text-align: center; margin: 10px 0;"><strong>OR</strong></p>

    <label for="image_url">Paste Image URL (Optional):</label>
    <input type="text" name="image_url" placeholder="https://...">

    <label for="sizes">Available Sizes:</label>
    <input type="text" name="sizes" placeholder="e.g. 40, 41, 42, 43">

    <label for="category">Category:</label>
    <input type="text" name="category" placeholder="e.g. Sneakers">

    <button type="submit">Add Product</button>
</form>

</body>
</html>
