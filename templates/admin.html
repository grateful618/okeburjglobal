<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Okeburjglobal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .admin-container {
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
			
        }
		
		.admin-menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-menu a {
           text-decoration: none;
        }

        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: #fff;
        }

        .product-card img {
            width: 100px;
            border-radius: 10px;
        }

        .actions button {
            margin-right: 10px;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
        }

        .edit-btn {
            background: orange;
            color: white;
        }

        .delete-btn {
            background: red;
            color: white;
        }

        .add-btn {
            background: green;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #006400;
        }
    </style>

</head>
<body>

<div class="admin-container">

    <div class="top-bar">
    <h1>Admin Dashboard</h1>

    <div class="admin-menu">
        <a href="/add_product" class="add-btn">➕ Add Product</a>
        <a href="/dashboard" class="add-btn">📋 Orders</a>
        <a href="/change_password" class="add-btn">🔒 Change Password</a>
        <a href="/logout" class="add-btn">🚪 Logout</a>
    </div>
</div>
    
	<hr>

    {% for p in products %}
    <div class="product-card">

        <img src="{{ url_for('static', filename='images/' + p[3]) }}">

        <div>
            <h3>{{ p[1] }}</h3>
            <p>₦{{ p[2] }}</p>
        </div>

        <div class="actions">

            <a href="/edit_product/{{ p[0] }}">
                <button class="edit-btn">Edit ✏️</button>
           

            <a href="/delete_product/{{ p[0] }}">
                <button class="delete-btn">Delete 🗑️</button>
            </a>

        </div>

    </div>
    {% endfor %}

</div>

</body>
</html>
