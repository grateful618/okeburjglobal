<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>

<h1>Add Product</h1>

<form method="POST">

    <label>sizes (comma separated)</label>
	<input type="text" name="sizes" placeholder="40,41,42,43,44,45,46,47">

    <input type="text" name="name" placeholder="Product Name" required>
    <br><br>

    <input type="number" name="price" placeholder="Price" required>
    <br><br>

    <input type="text" name="image" placeholder="Image filename (e.g sneakers1.jpg)" required>
    <br><br>

    <button type="submit">Save Product</button>

</form>

</body>
</html>
