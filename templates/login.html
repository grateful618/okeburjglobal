<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="box">

    <h2>Admin Login</h2>
	
	{% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>
        <br>

        <input type="password" name="password" placeholder="Password" required>
        <br>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
