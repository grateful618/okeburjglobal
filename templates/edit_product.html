<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="header">
    <h1>Edit Product</h1>
</header>

<div class="container">

    <form action="/edit_product/{{ product['id'] }}" method="POST" enctype="multipart/form-data">

    <label for="name">Product Name</label>
    <input type="text" name="name" value="{{ product['name'] }}" required>

    <label for="price">Price</label>
    <input type="number" name="price" value="{{ product['price'] }}" required>

    <label for="sizes">Sizes (comma-separated)</label>
    <input type="text" name="sizes" value="{{ product['sizes'] or '' }}">

    <label for="category">Category</label>
    <input type="text" name="category" value="{{ product['category'] or '' }}">

    <label for="image_file">Upload New Product Image</label>
    <input type="file" name="image_file" accept="image/*">

    <!-- Keep existing image URL as hidden fallback if no new file is picked -->
    <input type="hidden" name="existing_image" value="{{ product['image'] or '' }}">

    <button type="submit">Update Product</button>

</form>

</div>

</body>
</html>
